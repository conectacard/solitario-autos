<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>Solitario VIP - ZENITH CAR AGENCIA</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="game-container">
    <header class="game-header-branding">
      <div class="h-left">
        <button id="undoBtn" class="btn-undo"><i class="fas fa-undo"></i> UNDO</button>
        <button id="muteBtn" class="btn-undo" onclick="toggleAllAudio()"><i id="muteIcon" class="fas fa-volume-up"></i></button>
      </div>
      <div class="h-center">
        <img src="assets/img/logo.png" class="logo-header-big" alt="Logo">
        <span class="hotel-name-big">ZENITH CAR AGENCIA</span>
      </div>
      <div class="h-right">
        <button class="btn-share-vip" onclick="openMarketing()">
            <i class="fas fa-external-link-alt"></i> <span>:VISITANOS</span>
        </button>
        <button id="resetBtn" class="btn-reset">NEW</button>
      </div>
    </header>

    <main class="solitaire-table">
      <div class="top-row">
        <div id="stock" class="stack stock" onclick="handleStockClick()">
          <div id="stock-hint" class="stock-hint hidden">CLICK</div>
        </div>
        <div id="waste" class="stack waste"></div>
        <div class="spacer"></div>
        <div id="f-hearts" class="stack foundation" data-suit="hearts" onclick="moveToFoundation('hearts')">♥</div>
        <div id="f-diamonds" class="stack foundation" data-suit="diamonds" onclick="moveToFoundation('diamonds')">♦</div>
        <div id="f-clubs" class="stack foundation" data-suit="clubs" onclick="moveToFoundation('clubs')">♣</div>
        <div id="f-spades" class="stack foundation" data-suit="spades" onclick="moveToFoundation('spades')">♠</div>
      </div>

      <div class="bottom-row">
        <div id="t-0" class="stack tableau" onclick="moveToTableau(0)"></div>
        <div id="t-1" class="stack tableau" onclick="moveToTableau(1)"></div>
        <div id="t-2" class="stack tableau" onclick="moveToTableau(2)"></div>
        <div id="t-3" class="stack tableau" onclick="moveToTableau(3)"></div>
        <div id="t-4" class="stack tableau" onclick="moveToTableau(4)"></div>
        <div id="t-5" class="stack tableau" onclick="moveToTableau(5)"></div>
        <div id="t-6" class="stack tableau" onclick="moveToTableau(6)"></div>
      </div>
    </main>
  </div>

  <div id="marketing-modal" class="share-overlay hidden">
    <div class="share-box">
      <button class="close-share" onclick="this.parentElement.parentElement.classList.add('hidden')">&times;</button>
      <img src="assets/img/logo.png" style="height:40px; margin-bottom:15px;" alt="Logo">
      <h3 class="gold-text">PROMOCIONES</h3>
      <p>ES: Participa en nuestras promociones <strong>ZENITH CAR AGENCIA</strong>.</p>
      <p style="font-size: 0.8rem; margin-top:10px; font-style: italic;">EN: Join the giveaway.</p>
    </div>
  </div>

  <div id="share-modal" class="share-overlay hidden">
    <div class="share-box">
      <button class="close-share" onclick="closeShare()">&times;</button>
      <h3 class="gold-text">SHARE / COMPARTIR</h3>
      <p>ES: Comparte tu experiencia VIP / EN: Share your VIP experience</p>
      <div class="share-grid">
        <a href="#" id="share-wa" target="_blank" class="share-btn wa"><i class="fab fa-whatsapp"></i></a>
        <a href="#" id="share-fb" target="_blank" class="share-btn fb"><i class="fab fa-facebook-f"></i></a>
        <a href="#" id="share-tw" target="_blank" class="share-btn tw"><i class="fab fa-x-twitter"></i></a>
      </div>
    </div>
  </div>

  <audio id="sndClick" src="assets/sonidos/click.mp3"></audio>
  <audio id="sndAcierto" src="assets/sonidos/acierto.mp3"></audio>
  <audio id="sndError" src="assets/sonidos/error.mp3"></audio>
  <audio id="sndVictoria" src="assets/sonidos/victoria.mp3"></audio>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDIQfbFvWCRW0SWIKo0QB9bRXswUXFpxe0",
      authDomain: "solitario-hotel.firebaseapp.com",
      projectId: "solitario-hotel",
      storageBucket: "solitario-hotel.firebasestorage.app",
      messagingSenderId: "608605687811",
      appId: "1:608605687811:web:27c57bd3a8553dab823e36",
      measurementId: "G-L39PR4H2X8"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    window.db = firebase.firestore();
    window.storage = firebase.storage();
  </script>

  <script src="script.js"></script>
</body>
</html>
